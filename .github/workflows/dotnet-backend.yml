# CI：服务器侧 .NET 10 SDK 编译 + 双平台基线 + Linux 协议套件
# 沿革：B7 时期建（Gitee Go 兼容 GitHub Actions 语法）；主阵地迁 Gitea 后由
# GitHub 镜像（lovely-euglena/Cyrene-Agent，Gitea push mirror 自动同步）承接。
# runner 策略：public 仓库 Actions 免费——Linux 跑协议/契约/e2e 全链，Windows
# 跑 WPF/WinForms 原生编译（EnableWindowsTargeting 只能"能编"，真平台才算数）。
name: dotnet-backend

on:
  push:
    branches: [main]
    paths: ['dotnet/**', 'src/main/dotnet-backend/**', 'src/main/orchestrator/tools/**', 'src/main/sync/**', 'src/main/channels/**', 'src/main/proactive/**', 'src/pwa/**', 'fixtures/**', 'scripts/dual-track-diff.ts', 'scripts/dotnet-*.py', 'scripts/channel-*.py', 'scripts/pwa-e2e-test.mjs', 'scripts/check-cyrene-core-clean.py', '.github/workflows/dotnet-backend.yml']
  pull_request:
    paths: ['dotnet/**', 'src/main/orchestrator/tools/**', 'src/main/sync/**', 'src/main/channels/**', 'src/main/proactive/**', 'src/pwa/**', 'fixtures/**', 'scripts/dual-track-diff.ts', 'scripts/dotnet-*.py', 'scripts/channel-*.py', 'scripts/pwa-e2e-test.mjs', 'scripts/check-cyrene-core-clean.py', '.github/workflows/dotnet-backend.yml']
  # 手动入口：PR 分支经镜像同步后，在 Actions 页选分支 dispatch 验证（镜像仓无人发 PR，pull_request 仅保留语义）
  workflow_dispatch: {}

permissions:
  contents: read

# 守卫：只在镜像主仓执行——上游吸收带下来的 workflow、他人 fork 均不空跑
env:
  CI_GUARD_REPO: lovely-euglena/Cyrene-Agent

jobs:
  # ── Linux：编译 + 洁净断言 + 协议/契约/e2e 全链（B7 原套件，原样保留） ──
  build-linux:
    runs-on: ubuntu-latest
    if: github.repository == 'lovely-euglena/Cyrene-Agent'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build cyrene-core（跨平台核心）
        run: dotnet build dotnet/cyrene-core -c Release
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
      - name: cyrene-core 洁净断言（无 net10.0-windows / WPF / WinForms）
        run: python3 scripts/check-cyrene-core-clean.py
      - name: Build CyreneVoice（net10.0 跨平台）
        run: dotnet build dotnet/voice/CyreneVoice -c Release
      - name: Build smoke-host + Linux 协议套件（冒烟/边缘/矩阵/循环）
        run: |
          sudo apt-get update && sudo apt-get install -y libfontconfig1
          dotnet build dotnet/smoke-host -c Release
          python3 scripts/dotnet-smoke-linux.py
          python3 scripts/dotnet-edge-test.py
          python3 scripts/dotnet-tools-matrix.py
          python3 scripts/dotnet-agent-loop-test.py
      - name: sync-protocol v0/v0.1 + channels 契约（C# 读取器/物化器跑共享 fixtures）
        run: |
          dotnet dotnet/smoke-host/bin/Release/net10.0/cyrene-smoke.dll --selftest sync-protocol fixtures/sync-protocol/cases
          dotnet dotnet/smoke-host/bin/Release/net10.0/cyrene-smoke.dll --selftest sync-materialize fixtures/sync-protocol/materialize-cases
          dotnet dotnet/smoke-host/bin/Release/net10.0/cyrene-smoke.dll --selftest channel-contract fixtures/channels
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: PWA 构建（Vite；Node 仅构建期，产物进 cloud-server wwwroot）
        run: |
          cd src/pwa
          npm ci --no-audit --no-fund --registry=https://registry.npmmirror.com
          npm run build
      - name: cloud-server 发布（裸跑产物）+ 同步收敛冒烟（并发 push/fetch）
        run: |
          dotnet publish dotnet/cloud-server -c Release -o artifacts/cyrene-cloud
          python3 scripts/dotnet-cloud-sync-test.py artifacts/cyrene-cloud/cyrene-cloud-server.dll
      - name: 渠道套件：C# 五套自测 + mock e2e 冒烟（iLink/飞书 webhook/QQ 网关/归属）
        run: |
          dotnet artifacts/cyrene-cloud/cyrene-cloud-server.dll channel-selftest all
          python3 scripts/channel-smoke-test.py artifacts/cyrene-cloud/cyrene-cloud-server.dll
      - name: TS 类型检查 + 工具单测 + 双轨基线 + sync-protocol/渠道契约（TS 侧）
        run: |
          npm ci --registry=https://registry.npmmirror.com || npm install --registry=https://registry.npmmirror.com
          npx tsc -p tsconfig.main.json --noEmit
          npx vitest run src/main/orchestrator/tools
          npx vitest run src/main/sync src/pwa
          npx vitest run src/main/channels src/main/proactive
          npx tsx scripts/dual-track-diff.ts
      - name: PWA 端到端冒烟（Edge 通道：配对 / 查看 / 续聊 / 离线缓存）
        run: |
          npx playwright install msedge
          node scripts/pwa-e2e-test.mjs artifacts/cyrene-cloud/cyrene-cloud-server.dll
      - name: 留存 cloud-server 产物（失败诊断用）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cyrene-cloud-artifacts
          path: artifacts/cyrene-cloud
          retention-days: 7

  # ── Windows：WPF/WinForms 原生编译（此前在 Linux 靠 EnableWindowsTargeting"能编"，真平台才算数） ──
  build-windows:
    runs-on: windows-latest
    if: github.repository == 'lovely-euglena/Cyrene-Agent'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build cyrene-core（真 Windows 交叉验证，与 Linux 洁净断言互补）
        run: dotnet build dotnet/cyrene-core -c Release
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
      - name: Build cyrene-native（WPF/WinForms 原生平台）
        run: dotnet build dotnet/native-windows -c Release
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
      - name: Build CyreneVoice
        run: dotnet build dotnet/voice/CyreneVoice -c Release
