# 云端昔涟 cloud-server（2G 预算：mem_limit 512m + 日志上限 + 健康检查）
# 构建上下文 = 仓库根（PWA 构建需 src/pwa + src/main/sync；见 .dockerignore 白名单）
services:
  cloud-server:
    build:
      context: ../..
      dockerfile: dotnet/cloud-server/Dockerfile
    image: cyrene-cloud-server:dev
    container_name: cyrene-cloud-server
    restart: unless-stopped
    mem_limit: 512m
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:7789
      CYRENE_CLOUD_DATA: /data
      # CLOUD_TOKEN: change-me   # 主控令牌（引导/运维；IKJK2K）
      # CLOUD_LLM_API_KEY: change-me        # 服务端生成（IKJK2M）
      # CLOUD_LLM_MODEL: gpt-4o-mini
      # CLOUD_CHANNELS: wechat,feishu,qqbot   # 渠道托管（Phase 2；依赖上面的 CLOUD_LLM_API_KEY）
      # CLOUD_CHANNEL_OWNERSHIP_TTL_SECONDS: "180"
      # CLOUD_CHANNEL_FEISHU_APP_ID: change-me
      # CLOUD_CHANNEL_FEISHU_APP_SECRET: change-me
      # CLOUD_CHANNEL_FEISHU_VERIFICATION_TOKEN: change-me
      # CLOUD_CHANNEL_QQBOT_APP_ID: change-me
      # CLOUD_CHANNEL_QQBOT_APP_SECRET: change-me
      # 镜像已内置 ffmpeg（飞书语音）；体积敏感可 CLOUD_CHANNEL_FEISHU_AUDIO: "0"
    volumes:
      # 命名卷初始化继承镜像 /data 属主（cyrene, uid 10001）；bind mount 需自行 chown
      - cloud-data:/data
    ports:
      # 仅本机暴露；生产由反代终结 TLS（见 Caddyfile.example）
      - "127.0.0.1:7789:7789"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7789/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cloud-data:
