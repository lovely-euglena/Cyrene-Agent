appId: com.cyrene.live2d
productName: Cyrene
publish:
  provider: github
  owner: Playa-Cyrene
  repo: Cyrene-Agent
directories:
  output: release
asar: true
asarUnpack:
  - "**/vendor/srt-win/**"
  # LanceDB native（win32 msvc 补装的 .node 必须落磁盘真实路径）
  - "**/node_modules/onnxruntime-node/**"
  - "**/node_modules/@node-rs/jieba/**"
  - "**/node_modules/@node-rs/jieba-win32-x64-msvc/**"
  - "**/node_modules/@ast-grep/**"
  # Playwright MCP 以 ELECTRON_RUN_AS_NODE 模式运行，读不了 asar 虚拟路径，
  # 需真实磁盘文件（cli.js + 其依赖的 playwright / playwright-core）
  - "**/node_modules/@playwright/**"
  - "**/node_modules/playwright/**"
  - "**/node_modules/playwright-core/**"
  # Filesystem MCP 同理（dist/index.js + 其依赖的 sdk / diff / glob 等）
  - "**/node_modules/@modelcontextprotocol/**"
  - "**/node_modules/diff/**"
  - "**/node_modules/glob/**"
  - "**/node_modules/minimatch/**"
electronDist: node_modules/electron/dist
files:
  - dist/**/*
  - "!dist/components/**/*"
  - package.json
  - assets/**/*
  - vendor/**/*
  - "!vendor/cloud-music-mcp/**/*"
  - "!vendor/cyrene-skills/**/*"
  - "!models/**/*"
  # 平台裁剪（Linux 构建机交叉打 win 包：node_modules 装的是 linux 变体，
  # win 变体经 npm install --no-save 显式补装；两套并存故必须显式排除）
  - "!**/node_modules/@node-rs/jieba-linux-*/**"
  - "!**/node_modules/@node-rs/jieba-darwin*/**"
  - "!**/node_modules/@node-rs/jieba-android*/**"
  - "!**/node_modules/@node-rs/jieba-freebsd*/**"
  - "!**/node_modules/@ast-grep/napi-linux-*/**"
  - "!**/node_modules/@ast-grep/napi-darwin*/**"
  - "!**/node_modules/onnxruntime-node/bin/napi-v3/darwin/**"
  - "!**/node_modules/onnxruntime-node/bin/napi-v3/linux/**"
  - "!**/node_modules/sharp/build/**"
  - "!**/node_modules/@img/**"
  # prompts / skills 作为安装目录根下的独立文件夹，方便用户修改
extraFiles:
  - from: prompts
    to: prompts
  - from: skills
    to: skills
extraResources:
  - from: resources/bin/cyrene-screenshot.exe
    to: bin/cyrene-screenshot.exe
  - from: resources/bin/mpv
    to: bin/mpv
  - from: resources/mingit
    to: mingit
  - from: resources/components
    to: components
  # .NET 10 原生三件套窗口进程（framework-dependent：用户需安装
  # .NET 10 Desktop Runtime；文件缺失/未装运行时时 CYRENE_NATIVE_WINDOWS
  # 开关不生效，走 BrowserWindow 路径）
  - from: dotnet/native-windows/bin/Release/net10.0-windows/win-x64/publish
    to: native-windows
  # 语音后端 sidecar（F/G 阶段：TTS/ASR 引擎 + Silero VAD）。
  # 目录名必须是 voice：host-clients.ts 打包态按 resources/voice/ 找 exe；
  # silero_vad.onnx 由 csproj Content 带进 publish 的 models/ 子目录
  - from: dotnet/voice/CyreneVoice/bin/Release/net10.0/win-x64/publish
    to: voice
  # .NET embedding sidecar（bge-m3 ORT 加速；exe 存在时默认启用，缺失回退 worker）
  - from: dotnet/embedding-sidecar/bin/Release/net10.0/win-x64/publish
    to: embed-sidecar
  # 本地 OCR sidecar（Windows.Media.Ocr；缺失时 ocr_image 工具明确报「引擎未安装」）
  - from: dotnet/ocr-sidecar/bin/Release/net10.0-windows10.0.19041.0/win-x64/publish
    to: ocr
  # 模型不打进安装包（CI 无 models/；用户按 docs/local-models.md 手动安装）。
  # 运行时探测顺序见 src/main/rag/model-status.ts：
  #   打包态 = exe 同级 models/ → resources/embed-models → resources/models → …
  # 自定义内嵌构建可在本地追加（CI 缺目录会构建失败，勿无条件启用）：
  #   - from: models
  #     to: embed-models   # 对应打包态候选 resources/embed-models/Xenova/bge-m3
  # 第三方 skills 快照归档：首启解压到 userData/skills（见 src/main/skills/snapshot-install.ts）
  - from: vendor/cyrene-skills
    to: cyrene-skills
win:
  icon: assets/tray-icon.ico
  target:
    - nsis
nsis:
  artifactName: Cyrene-Setup-${version}.${ext}
  oneClick: false
  differentialPackage: true
  allowToChangeInstallationDirectory: true
  # Shortcut creation is controlled by the assisted install page below.
  createDesktopShortcut: false
  createStartMenuShortcut: true
  menuCategory: Cyrene
  include: build/installer/installer.nsh
  installerSidebar: build/installer/installer-sidebar.bmp
  uninstallerSidebar: build/installer/installer-sidebar.bmp
